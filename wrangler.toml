name = "xime-index"
main = "src/index.js"
compatibility_date = "2026-06-04"

routes = [{ pattern = "index.ailaogong.men", custom_domain = true }]

# 部署期变量(必须写这里;只在 Dashboard 设的会被 wrangler deploy 覆盖清空)
# dev 模式与默认基地址都指向本 fork 的 raw
[vars]
ENV = "dev"
GITHUB_RAW_URL = "https://raw.githubusercontent.com/JamesGZM/xime-index/main"

# 规则为仓库静态资源；构建只复制公开索引与规则，不打包 tests/scripts/src。
[build]
command = "python3 scripts/build_worker_assets.py"

[assets]
directory = ".worker-assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
