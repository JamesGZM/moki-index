# Moki 插件与方案市场索引
# 维护方式：PR 修改对应子目录下的文件，CI 自动校验
index_version: 1
updated_at: "2026-10-20"

# ─── 输入方案（详见 rimes/ 目录）─────────────────────────
schemas:
  from: "./rimes/index.yaml"

# ─── 插件（详见 plugins/ 目录）───────────────────────────
plugins:
  from: "./plugins/index.yaml"

# ─── 插件 v2（JS/QuickJS 插件，Moki >=0.0.1，SDK 1.0.0，详见 plugins/v2/ 目录）──
plugins_v2:
  from: "./plugins/v2/index.yaml"

# ─── 模型（详见 models/ 目录）───────────────────────────
models:
  from: "./models/index.yaml"

# ─── 键盘布局（详见 layouts/ 目录）───────────────────────
layouts:
  from: "./layouts/index.yaml"

# ─── 索引源 ───────────────────────────────────────────────
sources:
  - id: "moki-official"
    name: "Moki 官方源"
    url: "https://index.ailaogong.men/index.yaml"
    description: "Moki 官方维护的插件和方案市场"
