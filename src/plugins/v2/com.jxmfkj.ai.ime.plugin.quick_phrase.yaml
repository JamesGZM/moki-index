id: com.jxmfkj.ai.ime.plugin.quick_phrase
name: 常用语
author: JamesGZM
description: 把常用语联想进候选栏：读取宿主快捷发送库（设置里的快捷短语，含触发编码），输入时内容命中（条目以候选词开头）跟随该候选，编码命中（输入为
  code 前缀）放第二候选位，点选即上屏。数据经 host.quickSend.list() 读取，变更经 quick_send_changed 事件刷新。
type: remote
tags:
- 候选
- 常用语
pluginType: tool
icon: 语
activation: multi
minHostVersion: 0.0.1
platforms:
- android
capabilities:
  candidate_transform: true
  quick_send_read: true
  events:
  - quick_send_changed
